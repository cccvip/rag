# 测试环境配置：避免依赖外部 Qdrant / OpenAI Embedding
spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.qdrant.QdrantVectorStoreAutoConfiguration
  ai:
    openai:
      api-key: test-api-key
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        enabled: false
