info-pricing:
  mock-enabled: false
  attribution-mock-enabled: false
  news-search-mock-enabled: false
  anomaly-threshold: 1.5
  gnews-api-key: 1
  gnews-max-results: 10
  gnews-rate-limit-per-minute: 5
  gnews-daily-quota: 100

spring:
  mvc:
    converters:
      preferred-json-mapper: gson
  ai:
    openai:
      # 复用 DeepSeek OpenAI 兼容接口
      api-key: 2
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3

server:
  port: 8085
